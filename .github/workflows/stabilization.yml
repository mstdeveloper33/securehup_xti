name: XTI stabilization acceptance

# Expensive real installation and endurance checks are explicit release checks.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Acceptance jobs to run
        type: choice
        default: all
        options:
          - all
          - upgrade

permissions:
  contents: read

concurrency:
  group: xti-stabilization-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verification:
    if: ${{ inputs.scope != 'upgrade' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Select the configured Python for XTI
        run: echo "XTI_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Install the reviewed RSS/Atom and PDF test dependencies
        run: >-
          python -m pip --isolated install --disable-pip-version-check --no-input
          --index-url https://pypi.org/simple --only-binary=:all: --require-hashes
          -r requirements/news.txt -r requirements/reports.txt
      - name: Verify the complete offline suite
        run: ./scripts/check

  upgrade:
    name: Upgrade and recovery (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        tool: [brand, harvester]
    steps:
      - name: Check out candidate and published baseline history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Select the configured Python for XTI
        run: echo "XTI_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Install the reviewed Harvester installer
        if: matrix.tool == 'harvester'
        run: python -m pip install --disable-pip-version-check --no-input uv==0.13.8
      - name: Verify real upgrade and interrupted replacement in a disposable clone
        env:
          ACCEPTANCE_TOOL: ${{ matrix.tool }}
        run: ./scripts/bootstrap-python scripts/check-linux-upgrade.py --tool "$ACCEPTANCE_TOOL"

  operations:
    if: ${{ inputs.scope != 'upgrade' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Select the configured Python for XTI
        run: echo "XTI_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Prepare an isolated low-disk filesystem and user service manager
        run: |
          set -eu
          acceptance_uid=$(id -u)
          acceptance_gid=$(id -g)
          acceptance_disk="$RUNNER_TEMP/xti-low-disk"
          mkdir "$acceptance_disk"
          sudo mount -t tmpfs -o "size=48m,mode=0700,uid=$acceptance_uid,gid=$acceptance_gid" tmpfs "$acceptance_disk"
          sudo systemctl start "user@$acceptance_uid.service"
          echo "XDG_RUNTIME_DIR=/run/user/$acceptance_uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$acceptance_uid/bus" >> "$GITHUB_ENV"
      - name: Verify source failure, real systemd, bounded endurance and disk pressure
        run: >-
          ./scripts/python scripts/check-linux-operations.py
          --duration-seconds 600
          --low-disk-directory "$RUNNER_TEMP/xti-low-disk"
          --report "$RUNNER_TEMP/xti-operations.json"
      - name: Record measured operations result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/xti-operations.json" ]; then
            cat "$RUNNER_TEMP/xti-operations.json"
          fi
      - name: Unmount only the acceptance filesystem
        if: always()
        run: |
          if mountpoint -q "$RUNNER_TEMP/xti-low-disk"; then
            sudo umount "$RUNNER_TEMP/xti-low-disk"
          fi
