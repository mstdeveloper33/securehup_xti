name: XTI quick checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xti-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Select the configured Python for XTI
        run: echo "XTI_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Install the reviewed RSS/Atom and PDF test dependencies
        run: >-
          python -m pip --isolated install --disable-pip-version-check --no-input
          --index-url https://pypi.org/simple --only-binary=:all: --require-hashes
          -r requirements/news.txt -r requirements/reports.txt
      - name: Install hash-pinned channel test dependencies
        run: |
          python -m pip --isolated install --disable-pip-version-check --no-input --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements/channels-build.txt
          python -m pip --isolated install --disable-pip-version-check --no-input --index-url https://pypi.org/simple --no-build-isolation --require-hashes -r requirements/channels.txt
      - name: Run fast offline checks
        env:
          XTI_CHECK_SHARD: ${{ matrix.shard }}/3
        run: ./scripts/check-fast

