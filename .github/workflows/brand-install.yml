name: XTI brand install

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brand-install.yml"
      - "constraints/brand.txt"
      - "pyproject.toml"
      - "requirements/news.txt"
      - "requirements/reports.txt"
      - "requirements/channels.txt"
      - "requirements/channels-build.txt"
      - "requirements/brand-protection.txt"
      - "tests/test_news_installation.py"
      - "setup"
      - "xti"
      - "scripts/python"
      - "scripts/bootstrap-python"
      - "scripts/run_python.py"
      - "scripts/check-linux-brand-install.py"
      - "scripts/check-linux-install.py"
      - "scripts/setup_brand.py"
      - "src/xti/adapters/tool_installation.py"
      - "src/xti/adapters/installation_*.py"
      - "src/xti/adapters/source_readiness.py"
      - "tests/test_setup_brand.py"
      - "tests/test_brand_runtime.py"
      - "tests/test_ci_configuration.py"
      - "tests/test_setup.py"
      - "tests/test_component_pins.py"
      - "tests/test_maigret_username.py"
      - "tests/test_sherlock_username.py"
      - "tests/test_tool_installation.py"
      - "tests/test_source_readiness_adapter.py"
      - "scripts/setup-brand"
      - "scripts/verify-brand"
      - "scripts/verify_brand_install.py"
      - "src/xti/__init__.py"
      - "src/xti/domain/brand_username.py"
      - "src/xti/domain/component_pins.py"
      - "src/xti/application/brand_username.py"
      - "src/xti/adapters/maigret_username.py"
      - "src/xti/adapters/sherlock_username.py"
      - "src/xti/adapters/sherlock_username_worker.py"
  pull_request:
    paths:
      - ".github/workflows/brand-install.yml"
      - "constraints/brand.txt"
      - "pyproject.toml"
      - "requirements/news.txt"
      - "requirements/reports.txt"
      - "requirements/channels.txt"
      - "requirements/channels-build.txt"
      - "requirements/brand-protection.txt"
      - "tests/test_news_installation.py"
      - "setup"
      - "xti"
      - "scripts/python"
      - "scripts/bootstrap-python"
      - "scripts/run_python.py"
      - "scripts/check-linux-brand-install.py"
      - "scripts/check-linux-install.py"
      - "scripts/setup_brand.py"
      - "src/xti/adapters/tool_installation.py"
      - "src/xti/adapters/installation_*.py"
      - "src/xti/adapters/source_readiness.py"
      - "tests/test_setup_brand.py"
      - "tests/test_brand_runtime.py"
      - "tests/test_ci_configuration.py"
      - "tests/test_setup.py"
      - "tests/test_component_pins.py"
      - "tests/test_maigret_username.py"
      - "tests/test_sherlock_username.py"
      - "tests/test_tool_installation.py"
      - "tests/test_source_readiness_adapter.py"
      - "scripts/setup-brand"
      - "scripts/verify-brand"
      - "scripts/verify_brand_install.py"
      - "src/xti/__init__.py"
      - "src/xti/domain/brand_username.py"
      - "src/xti/domain/component_pins.py"
      - "src/xti/application/brand_username.py"
      - "src/xti/adapters/maigret_username.py"
      - "src/xti/adapters/sherlock_username.py"
      - "src/xti/adapters/sherlock_username_worker.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xti-brand-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-install:
    name: brand-install (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Select the configured Python for XTI
        run: echo "XTI_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Install the reviewed RSS/Atom and PDF test dependencies
        run: >-
          python -m pip --isolated install --disable-pip-version-check --no-input
          --index-url https://pypi.org/simple --only-binary=:all: --require-hashes
          -r requirements/news.txt -r requirements/reports.txt
      - name: Verify installer and runtime recovery regressions offline
        id: offline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          ./scripts/python -m unittest -v \
            tests/test_setup.py \
            tests/test_news_installation.py \
            tests/test_setup_brand.py \
            tests/test_brand_runtime.py \
            tests/test_tool_installation.py \
            tests/test_component_pins.py \
            tests/test_maigret_username.py \
            tests/test_sherlock_username.py \
            tests/test_source_readiness_adapter.py \
            tests/test_ci_configuration.py
      - name: Accept clean brand installation and preserve temporary records
        id: acceptance
        run: ./scripts/bootstrap-python scripts/check-linux-brand-install.py
      - name: Record brand acceptance scope and outcome
        if: always()
        env:
          OFFLINE_RESULT: ${{ steps.offline.outcome }}
          ACCEPTANCE_RESULT: ${{ steps.acceptance.outcome }}
        run: |
          {
            echo "### Linux brand installation job"
            echo "- Offline installer/runtime/recovery tests: $OFFLINE_RESULT"
            echo "- Real clean installation and local data acceptance: $ACCEPTANCE_RESULT"
            echo "- All database/evidence acceptance data is temporary."
            echo "- No username lookup, source collection or active scan runs here."
            echo "- Persistent service and 24/7 acceptance remain separate."
          } >> "$GITHUB_STEP_SUMMARY"
