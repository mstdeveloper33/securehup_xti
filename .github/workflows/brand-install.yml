name: XTI brand install

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brand-install.yml"
      - "constraints/brand.txt"
      - "pyproject.toml"
      - "setup"
      - "scripts/python"
      - "scripts/setup-brand"
      - "scripts/verify-brand"
      - "scripts/verify_brand_install.py"
      - "src/xti/__init__.py"
      - "src/xti/domain/brand_username.py"
      - "src/xti/application/brand_username.py"
      - "src/xti/adapters/maigret_username.py"
      - "src/xti/adapters/sherlock_username.py"
      - "src/xti/adapters/sherlock_username_worker.py"
  pull_request:
    paths:
      - ".github/workflows/brand-install.yml"
      - "constraints/brand.txt"
      - "pyproject.toml"
      - "setup"
      - "scripts/python"
      - "scripts/setup-brand"
      - "scripts/verify-brand"
      - "scripts/verify_brand_install.py"
      - "src/xti/__init__.py"
      - "src/xti/domain/brand_username.py"
      - "src/xti/application/brand_username.py"
      - "src/xti/adapters/maigret_username.py"
      - "src/xti/adapters/sherlock_username.py"
      - "src/xti/adapters/sherlock_username_worker.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xti-brand-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and verify the pinned brand toolchain
        run: ./setup
      - name: Recheck without downloading
        run: ./scripts/setup-brand --check
